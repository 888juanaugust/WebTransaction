; The queue worker, two processes, restarted by `php artisan queue:restart`
; on every deploy. Installed by provision.sh to /etc/supervisor/conf.d/.
[program:central-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /srv/central/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
directory=/srv/central
autostart=true
autorestart=true
user=central
numprocs=2
redirect_stderr=true
stdout_logfile=/srv/central/storage/logs/worker.log
stopwaitsecs=3600
