# /etc/supervisor/conf.d/webtransaction-worker.conf — installed by
# deploy/provision.sh.
#
# Two processes, not ten: twenty orders a day needs no pool, but two means
# one can be busy with a slow price-list import while the other still picks
# up the next job. stopwaitsecs lets a worker finish the job in its hands
# before supervisor kills it — the jobs are idempotent either way, but there
# is no reason to make a retry do work a graceful stop avoids.

[program:webtransaction-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/webtransaction/artisan queue:work --queue=default --tries=5 --max-time=3600
directory=/var/www/webtransaction
autostart=true
autorestart=true
user=deploy
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/webtransaction-worker.log
stopwaitsecs=3600
